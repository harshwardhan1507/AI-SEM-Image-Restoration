# Experiment 003 Configuration: Scaled NAFNet Width 64 SEM Image Restoration
experiment_id: "exp003_nafnet_width64"
description: "Scaled NAFNet with width=64 on SEM dataset for 50 epochs."

system:
  seed: 42
  device: "auto"
  log_dir: "logs/exp003_nafnet_width64"
  checkpoint_dir: "outputs/checkpoints/exp003_nafnet_width64"
  tensorboard_dir: "outputs/tensorboard/exp003_nafnet_width64"

data:
  dataset_dir: "./dataset"
  splits: ["train", "val"]
  train_batch_size: 4
  val_batch_size: 4
  num_workers: 4
  pin_memory: true

model:
  name: "NAFNet"
  img_channel: 1
  width: 64
  middle_blk_num: 1
  enc_blk_nums: [1, 1, 1]
  dec_blk_nums: [1, 1, 1]
  upscale: 2
  drop_out_rate: 0.0

loss:
  name: "charbonnier"
  eps: 1.0e-3
  reduction: "mean"

train:
  epochs: 50
  batch_size: 4
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  min_lr: 1.0e-6
  mixed_precision: false
  val_freq: 1
  log_freq: 10
