# Experiment 006 Configuration: Scaled NAFNet Width 48 SEM Image Restoration - PSNR Loss
experiment_id: "exp006_nafnet_psnr"
description: "Scaled NAFNet with width=48 on SEM dataset for 50 epochs with PSNR loss."

system:
  seed: 42
  device: "auto"
  log_dir: "logs/exp006_nafnet_psnr"
  checkpoint_dir: "outputs/checkpoints/exp006_nafnet_psnr"
  tensorboard_dir: "outputs/tensorboard/exp006_nafnet_psnr"

data:
  dataset_dir: "./dataset"
  splits: ["train", "val"]
  train_batch_size: 4
  val_batch_size: 4
  num_workers: 4
  pin_memory: true

model:
  name: "NAFNet"
  img_channel: 1
  width: 48
  middle_blk_num: 1
  enc_blk_nums: [1, 1, 1]
  dec_blk_nums: [1, 1, 1]
  upscale: 2
  drop_out_rate: 0.0

loss:
  name: "psnr"
  data_range: 1.0
  eps: 1.0e-8

metrics:
  psnr: true
  ssim: true
  lpips: true

train:
  epochs: 50
  batch_size: 4
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  min_lr: 1.0e-6
  mixed_precision: false
  val_freq: 1
  log_freq: 10
